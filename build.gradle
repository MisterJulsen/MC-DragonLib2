plugins {
    id 'dev.architectury.loom' version '1.9-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.0.0' apply false
    id "net.mrjulsen.mod-build-tools" version "2.0.4"
}



architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    configurations.configureEach {
        if (rootProject.hasProperty("lwjgl_version")) {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.lwjgl") {
                    details.useVersion rootProject.lwjgl_version
                }
            }
        }
    }

    repositories {
        mavenCentral()
        maven { url = file("${System.getProperty('user.home')}/.m2/github/modsrepo/maven/") } // Local
        maven { url = "https://maven.mrjulsen.net" } // DragonLib
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
        maven { url = "https://maven.parchmentmc.org" } // ParchmentMC
        maven { url = "https://maven.terraformersmc.com/" } // ModMenu


        maven { url = "https://cursemaven.com" // Time Control
            content {
                includeGroup "curse.maven"
            }
        }
        maven { url 'https://maven.isxander.dev/releases' }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft_version}:${rootProject.parchment_version}@zip")
        }
    }
    
    processResources {
        def expandProps = [
            "version": version,
            "minecraft_version": rootProject.minecraft_version,
            "datapack_version": rootProject.datapack_version,
            "issues": rootProject.issues,
            "source": rootProject.source,
            "license": rootProject.license,
            "modid": rootProject.archives_name,
            "display_name": rootProject.display_name,
            "homepage": rootProject.homepage,
            "authors": rootProject.authors,
            "description": rootProject.description,
            "icon": rootProject.icon,
            "discord": rootProject.discord,
            "next_unsupported_minecraft_version": rootProject.next_unsupported_minecraft_version,
            "dragonlib_version": "$rootProject.minecraft_version-$rootProject.mod_version",
            "neoforge_loader_version": rootProject.neoforge_loader_version,
            "neoforge_dependency_version": rootProject.neoforge_dependency_version,
            "fabric_loader_version": rootProject.fabric_loader_version,
            "java_version": rootProject.java_version,
            "architectury_api_version": rootProject.architectury_api_version,
            "maven_group": rootProject.maven_group,
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml', "dragonlib.mixins.json", 'architectury.common.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
        exclude ".cache"
    }

    java {
        withSourcesJar()
        withJavadocJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    jar {
        manifest {
            attributes([
                    "Specification-Title"     : "${rootProject.display_name}",
                    "Specification-Vendor"    : "${rootProject.authors}",
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : "${rootProject.display_name}",
                    "Implementation-Version"  : "${project.version}",
                    "Implementation-Vendor"   : "${rootProject.authors}",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "Built-On"                : "${rootProject.minecraft_version}",
                    "Build-Jdk"               : "${System.getProperty('java.version')} (${System.getProperty('java.vendor')})"
            ])
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

modBuildTools {
    modId = project.mod_id
    displayName = project.display_name

    publish {
        localRepoDir = file("${System.getProperty('user.home')}/.m2/github/modsrepo/maven/")
        mavenGroup = project.maven_group
    }
}