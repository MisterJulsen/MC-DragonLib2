modLoader = "javafml"
loaderVersion = "[${neoforge_loader_version},)"
issueTrackerURL = "${issues}"
license = "${license}"

[[mods]]
modId = "${modid}"
version = "${version}"
displayName = "${display_name}"
displayUrl="${homepage}"
authors = "${authors}"
description = '''${description}'''
logoFile = "${icon}"

[[dependencies.${modid}]]
modId = "neoforge"
mandatory = true
versionRange = "[${neoforge_dependency_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},${next_unsupported_minecraft_version})"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "architectury"
mandatory = true
versionRange = "[${architectury_api_version},)"
ordering = "BEFORE"
side = "BOTH"
