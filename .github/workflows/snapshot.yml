name: Snapshot Build

on:
  push:
    branches-ignore:
      - "auto-port/**"
      - "l10n/**"
  workflow_dispatch:

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
      version_branch: ${{ steps.read.outputs.version_branch }}
      retention_days: ${{ steps.read.outputs.retention_days }}
      java_versions: ${{ steps.read.outputs.java_versions }}
    steps:
      - uses: actions/checkout@v4

      - name: Read build_tools.config
        id: read
        run: |
          CONFIG=build_tools.config
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG not found in the repository root"
            exit 1
          fi
          {
            echo "enabled=$(jq -r '.snapshot.enabled // true' "$CONFIG")"
            echo "retention_days=$(jq -r '.snapshot.retention_days // 30' "$CONFIG")"
            echo "version_branch=$(jq -r --arg b "$GITHUB_REF_NAME" 'any(.version_branches[]?; . == $b)' "$CONFIG")"
            echo "java_versions<<EOF"
            jq -r '(.java_versions // [17, 21])[]' "$CONFIG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report skip reason
        run: |
          if [ "${{ steps.read.outputs.enabled }}" != "true" ]; then
            echo "Snapshot builds are disabled in build_tools.config."
          elif [ "${{ steps.read.outputs.version_branch }}" != "true" ]; then
            echo "Branch '$GITHUB_REF_NAME' is not listed in version_branches - nothing to do."
          fi

  build:
    needs: config
    if: needs.config.outputs.enabled == 'true' && needs.config.outputs.version_branch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java_versions }}

      - name: Register Java toolchains
        run: |
          mkdir -p ~/.gradle
          INSTALLATIONS=$(env | grep -o '^JAVA_HOME_[0-9]*_[A-Z0-9]*' | sort -u | paste -sd,)
          echo "org.gradle.java.installations.fromEnv=${INSTALLATIONS}" >> ~/.gradle/gradle.properties
          echo "Toolchains: ${INSTALLATIONS}"

      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          gradle-version: wrapper

      - name: Build
        env:
          SNAPSHOT_BUILD: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew buildWithMetadata

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p snapshot-dist

          for LOADER in $(jq -r '.artifacts | keys[]' metadata.json); do
            for KIND in main_jar sources_jar javadoc_jar; do
              NAME=$(jq -r --arg l "$LOADER" --arg k "$KIND" '.artifacts[$l][$k]' metadata.json)
              [ -n "$NAME" ] && [ "$NAME" != "null" ] || continue

              FOUND=$(find . -type f -name "$NAME" ! -path "*/.gradle/*" ! -path "./snapshot-dist/*" | head -n1)
              if [ -z "$FOUND" ]; then
                if [ "$KIND" = "main_jar" ]; then
                  echo "::error::Missing $KIND for $LOADER: $NAME"
                  exit 1
                fi
                echo "::warning::Missing $KIND for $LOADER: $NAME"
                continue
              fi
              cp "$FOUND" snapshot-dist/
            done
          done

          cp metadata.json snapshot-dist/
          ls -1 snapshot-dist
          echo "version=$(jq -r '.full_version' metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: snapshot-${{ steps.collect.outputs.version }}
          path: snapshot-dist/*
          retention-days: ${{ needs.config.outputs.retention_days }}

      - name: Summary
        run: |
          {
            echo "### Snapshot ${{ steps.collect.outputs.version }}"
            echo ""
            echo "Branch \`$GITHUB_REF_NAME\` at \`${GITHUB_SHA:0:7}\`."
            echo ""
            echo "Download: artifact \`snapshot-${{ steps.collect.outputs.version }}\` on this run."
            echo ""
            echo "| File |"
            echo "|---|"
            for FILE in $(ls -1 snapshot-dist); do
              echo "| \`$FILE\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
