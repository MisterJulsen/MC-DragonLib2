name: Auto Port

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Number of the merged pull request to port"
        required: true
      target_branches:
        description: "Comma separated target branches (empty = all version branches)"
        required: false

concurrency:
  group: auto-port-${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  config:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'auto-port'))
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.read.outputs.enabled }}
      source_branch: ${{ steps.read.outputs.source_branch }}
      targets: ${{ steps.read.outputs.targets }}
      draft_on_conflict: ${{ steps.read.outputs.draft_on_conflict }}
    steps:
      - uses: actions/checkout@v4

      - name: Read build_tools.config
        id: read
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          INPUT_TARGETS: ${{ inputs.target_branches }}
        run: |
          CONFIG=build_tools.config
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG not found in the repository root"
            exit 1
          fi

          if [ -n "$INPUT_TARGETS" ]; then
            TARGETS=$(echo "$INPUT_TARGETS" | tr ',' ' ' | xargs)
          else
            TARGETS=$(jq -r '.version_branches[]?' "$CONFIG" | xargs)
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            SOURCE=$(jq -r --arg b "$BASE_REF" 'any(.version_branches[]?; . == $b)' "$CONFIG")
          else
            SOURCE=true
          fi

          {
            echo "enabled=$(jq -r '.auto_port.enabled // true' "$CONFIG")"
            echo "draft_on_conflict=$(jq -r '.auto_port.draft_on_conflict // true' "$CONFIG")"
            echo "source_branch=$SOURCE"
            echo "targets=$TARGETS"
          } >> "$GITHUB_OUTPUT"

      - name: Report skip reason
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ENABLED: ${{ steps.read.outputs.enabled }}
          SOURCE: ${{ steps.read.outputs.source_branch }}
          TARGETS: ${{ steps.read.outputs.targets }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "Auto port is disabled in build_tools.config."
          elif [ "$SOURCE" != "true" ]; then
            echo "Base branch '$BASE_REF' is not listed in version_branches - nothing to port."
          elif [ -z "$TARGETS" ]; then
            echo "No target branches configured."
          fi

  port:
    needs: config
    if: >-
      needs.config.outputs.enabled == 'true' &&
      needs.config.outputs.source_branch == 'true' &&
      needs.config.outputs.targets != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_PORT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AUTO_PORT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" \
            --json number,title,body,baseRefName,headRefName,mergedAt \
            > "$RUNNER_TEMP/pr.json"

          if [ "$(jq -r '.mergedAt' "$RUNNER_TEMP/pr.json")" = "null" ]; then
            echo "::error::Pull request #$PR_NUMBER is not merged"
            exit 1
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r '.baseRefName' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Prepare patch
        id: patch
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          git fetch origin "refs/pull/${PR_NUMBER}/head:refs/auto-port/source"
          git fetch origin "$BASE"

          FORK_POINT=$(git merge-base "origin/${BASE}" refs/auto-port/source)
          git diff --binary "$FORK_POINT" refs/auto-port/source > "$RUNNER_TEMP/port.patch"

          if [ -s "$RUNNER_TEMP/port.patch" ]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "Pull request #${PR_NUMBER} contains no changes."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure auto-port label
        if: steps.patch.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUTO_PORT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh label create "auto-port" \
            --color "1D76DB" \
            --description "Created by the auto port workflow" \
            2>/dev/null || true

      - name: Create port pull requests
        if: steps.patch.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUTO_PORT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.pr.outputs.base }}
          TARGETS: ${{ needs.config.outputs.targets }}
          DRAFT_ON_CONFLICT: ${{ needs.config.outputs.draft_on_conflict }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TITLE=$(jq -r '.title' "$RUNNER_TEMP/pr.json")
          BODY=$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")
          FAILED=""

          for TARGET in $TARGETS; do
            echo "::group::$TARGET"

            if [ "$TARGET" = "$BASE" ]; then
              echo "Same as the source branch - skipped."
              echo "::endgroup::"
              continue
            fi

            if ! git ls-remote --exit-code --heads origin "$TARGET" > /dev/null 2>&1; then
              echo "Branch does not exist - skipped."
              echo "::endgroup::"
              continue
            fi

            git reset --hard
            git clean -fd
            git fetch origin "$TARGET"

            PORT_BRANCH="auto-port/${PR_NUMBER}-$(echo "$TARGET" | tr '/' '-')"
            git checkout -B "$PORT_BRANCH" "origin/${TARGET}"

            CONFLICT=false
            git apply --3way --whitespace=nowarn "$RUNNER_TEMP/port.patch" || CONFLICT=true
            git add -A

            if git diff --cached --quiet; then
              if [ "$CONFLICT" = "true" ]; then
                echo "::warning::Patch of #${PR_NUMBER} could not be applied to '${TARGET}'."
                FAILED="${FAILED} ${TARGET}"
              else
                echo "Changes are already present - skipped."
              fi
              echo "::endgroup::"
              continue
            fi

            if [ "$CONFLICT" = "true" ]; then
              PR_TITLE="[Port #${PR_NUMBER} -> ${TARGET}] ${TITLE} (conflicts)"
              COMMIT_MESSAGE="Port #${PR_NUMBER}: ${TITLE} (with conflicts)"
              WARNING="> [!WARNING]
          > This port has merge conflicts. Resolve the conflict markers before merging.

          "
            else
              PR_TITLE="[Port #${PR_NUMBER} -> ${TARGET}] ${TITLE}"
              COMMIT_MESSAGE="Port #${PR_NUMBER}: ${TITLE}"
              WARNING=""
            fi

            git commit -m "$COMMIT_MESSAGE" -m "Ported from ${BASE} to ${TARGET}."
            git push --force origin "$PORT_BRANCH"

            if [ -n "$(gh pr list --head "$PORT_BRANCH" --state open --json number -q '.[0].number')" ]; then
              echo "Existing pull request updated."
              echo "::endgroup::"
              continue
            fi

            DRAFT=""
            if [ "$CONFLICT" = "true" ] && [ "$DRAFT_ON_CONFLICT" = "true" ]; then
              DRAFT="--draft"
            fi

            gh pr create \
              --base "$TARGET" \
              --head "$PORT_BRANCH" \
              --title "$PR_TITLE" \
              --label "auto-port" \
              $DRAFT \
              --body "${WARNING}Automatic port of #${PR_NUMBER} from \`${BASE}\` to \`${TARGET}\`.

          ---

          ${BODY}"

            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "::error::Auto port failed for:${FAILED}"
            exit 1
          fi
