name: Build Test

on: [pull_request]

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read build_tools.config
        id: cfg
        run: |
          CONFIG=build_tools.config
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG not found in the repository root"
            exit 1
          fi
          {
            echo "java_versions<<EOF"
            jq -r '(.java_versions // [17, 21])[]' "$CONFIG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.cfg.outputs.java_versions }}

      - name: Register Java toolchains
        run: |
          mkdir -p ~/.gradle
          INSTALLATIONS=$(env | grep -o '^JAVA_HOME_[0-9]*_[A-Z0-9]*' | sort -u | paste -sd,)
          echo "org.gradle.java.installations.fromEnv=${INSTALLATIONS}" >> ~/.gradle/gradle.properties
          echo "Toolchains: ${INSTALLATIONS}"

      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          gradle-version: wrapper

      - name: Build
        env:
          TEST_BUILD: ${{ github.event.pull_request.number }}
        run: |
          chmod +x gradlew
          ./gradlew buildWithMetadata

      - name: Collect JARs
        run: |
          mkdir -p pr-dist
          for LOADER in $(jq -r '.artifacts | keys[]' metadata.json); do
            NAME=$(jq -r --arg l "$LOADER" '.artifacts[$l].main_jar' metadata.json)
            FOUND=$(find . -type f -name "$NAME" ! -path "*/.gradle/*" ! -path "./pr-dist/*" | head -n1)
            if [ -z "$FOUND" ]; then
              echo "::error::Artifact not found: $NAME"
              exit 1
            fi
            cp "$FOUND" pr-dist/
          done
          ls -1 pr-dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: test-pr${{ github.event.pull_request.number }}
          path: pr-dist/*
          retention-days: 14
