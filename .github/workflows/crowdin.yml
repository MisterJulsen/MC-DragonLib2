name: Crowdin Sync

on:
  workflow_dispatch:
    inputs:
      upload_sources:
        description: "Upload en_us source strings to Crowdin"
        type: boolean
        required: true
        default: true
      download_translations:
        description: "Download translations from Crowdin (creates a pull request)"
        type: boolean
        required: true
        default: true
      upload_translations:
        description: "Overwrite the translations on Crowdin with the local ones"
        type: boolean
        required: true
        default: false

concurrency:
  group: crowdin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check credentials
        env:
          PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          TOKEN: ${{ secrets.CROWDIN_TOKEN }}
        run: |
          [ -n "$PROJECT_ID" ] || { echo "::error::Repository variable CROWDIN_PROJECT_ID is not set"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::Repository secret CROWDIN_TOKEN is not set"; exit 1; }

      - name: Sync with Crowdin
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          project_id: ${{ vars.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_TOKEN }}

          upload_sources: ${{ inputs.upload_sources }}

          upload_translations: ${{ inputs.upload_translations }}
          upload_translations_args: "--import-duplicates"
          auto_approve_imported: true
          import_eq_suggestions: false

          download_translations: ${{ inputs.download_translations }}
          skip_untranslated_strings: true
          export_only_approved: false

          push_translations: ${{ inputs.download_translations }}
          commit_message: "Update translations from Crowdin"
          localization_branch_name: l10n/${{ github.ref_name }}
          create_pull_request: ${{ inputs.download_translations }}
          pull_request_title: "Update translations from Crowdin"
          pull_request_body: "Automatically generated by the Crowdin Sync workflow."
          pull_request_base_branch_name: ${{ github.ref_name }}
          pull_request_labels: translations

          github_user_name: "github-actions[bot]"
          github_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
